    inventory: "{{ ire_inventory }}"
    job_type: "run"
    verbosity: 0
    timeout: 0
    allow_simultaneous: false
    use_fact_cache: false
    survey_enabled: false
    become_enabled: false
    diff_mode: false
    ask_variables_on_launch: false
    credentials:
      - "{{ ire_aws_credential }}"
    extra_vars:
      terraform_destroy_enabled: false
      terraform_destroy_confirmation: ""
