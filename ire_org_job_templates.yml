    become_enabled: false
    diff_mode: false
    ask_variables_on_launch: false
    credentials:
      - "{{ ire_aws_credential }}"
    extra_vars:
      managed_ad_group_name: "{{ ire_managed_ad_group_name }}"

  - name: "IRE - Managed AD - Bootstrap"
    description: "Bootstraps IRE Managed AD users/groups and publishes workflow artifacts"
    organization: "{{ ire_aap_org }}"
    project: "{{ ire_project }}"
    playbook: "playbooks/directory/bootstrap.yml"
    execution_environment: "{{ ire_execution_environment }}"
    inventory: "{{ ire_inventory }}"
    job_type: "run"
    verbosity: 0
    timeout: 0
    allow_simultaneous: false
    use_fact_cache: false
    survey_enabled: false
    become_enabled: false
    diff_mode: false
    ask_variables_on_launch: true
    credentials:
      # HOME AWX uses only the AWS credential on this JT. The Managed AD
      # password credential is attached to the Identity Terraform JTs.
      - "{{ ire_aws_credential }}"
    extra_vars:
      directory_environment: "{{ ire_environment }}"
      directory_aws_region: "{{ ire_aws_region }}"
      managed_ad_bootstrap_reset_existing_passwords: false

  - name: "IRE - Managed AD - Unbootstrap"
