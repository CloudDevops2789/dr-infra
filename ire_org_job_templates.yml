---
# IRE Job Templates for the organization AAP Controller.
#
# Source of truth used to build this template:
# - Home AWX 24.6.1 API snapshot
# - Current stack-specific Terraform lifecycle playbooks
#
# Intentional organization adaptations:
# - Project, Inventory, EE and credential names use organization objects.
# - Runtime values are supplied by ire_org_vars.yml / workflow node extra_data.
# - Legacy HOME objects under IRE_Project and legacy IRE-INFRASTRUCTURE-* flows
#   are intentionally not reproduced.
#
# The infra.aap_configuration dispatch role accepts controller_templates.

controller_templates:

  # ===========================================================================
  # Persistent
  # ===========================================================================

  - name: "IRE - Terraform - Persistent - Plan"
    description: "Terraform plan for the IRE Persistent stack"
    organization: "{{ ire_aap_org }}"
    project: "{{ ire_project }}"
    playbook: "playbooks/terraform/plan/persistent.yml"
    execution_environment: "{{ ire_execution_environment }}"
    inventory: "{{ ire_inventory }}"
    job_type: "run"
    verbosity: 0
    timeout: 0
    allow_simultaneous: false
    use_fact_cache: false
    survey_enabled: false
    become_enabled: false
    diff_mode: false
    ask_variables_on_launch: false
    credentials:
      - "{{ ire_aws_credential }}"
    extra_vars:
      terraform_variables: {}

  - name: "IRE - Terraform - Persistent - Apply"
    description: "Terraform apply for the IRE Persistent stack"
